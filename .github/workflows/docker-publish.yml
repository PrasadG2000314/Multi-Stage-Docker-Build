
name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  # GitHub username/repo-name format එකෙන් image නම සෑදේ
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR වෙත push කිරීමට අනිවාර්ය permission එකක්

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Docker Buildx මඟින් advanced caching සහ multi-platform build හැකියාව ලැබේ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Container Registry එකට Login වීම (GITHUB_TOKEN එක GitHub විසින්ම සපයයි)
      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Commit SHA, branch name, tags අනුව Docker tags ස්වයංක්‍රීයව generate කිරීම
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # Image එක build කර push කිරීම + GitHub Actions cache භාවිත කිරීම
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
